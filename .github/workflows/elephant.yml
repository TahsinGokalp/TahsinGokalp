name: "🐘 Elephant"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Runs Every Day
  push:
    branches: [main]
    paths:
      - 'scripts/elephant.py'
      - 'assets/elephant.png'
      - '.github/workflows/elephant.yml'

permissions:
  contents: write

jobs:
  generate:
    name: "Generate Elephant"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Fetching Repository Contents"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "🐘 Drawing The Elephant"
        run: python3 scripts/elephant.py ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "🚀 Pushing To Output Branch"
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
